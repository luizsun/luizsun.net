<!doctype html>
<!-- NÃO HÁ NADA DEMAIS NO CÓDIGO FONTE, AMIGO. -->

<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Site em Construção</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: #000;
      font-family: "JetBrains Mono", "Courier New", monospace;
      color: #bfffbf;
    }

    #matrix {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      display: block;
    }

    .center {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: rgba(0,0,0,0.65);
      border: 1px solid rgba(0,255,80,0.12);
      box-shadow: 0 0 40px rgba(0,255,80,0.06), 0 0 8px rgba(0,255,80,0.08) inset;
      padding: 40px 32px;
      border-radius: 10px;
      text-align: center;
      max-width: 500px;
      width: 100%;
    }

    h1 {
      font-size: 28px;
      letter-spacing: 2px;
      color: #bfffbf;
      margin-bottom: 14px;
    }

    p {
      color: #91ff91;
      opacity: .9;
      font-size: 15px;
      line-height: 1.5;
    }

    .ghost-line {
      margin-top: 22px;
      font-size: 12px;
      color: rgba(150,255,160,0.75);
      letter-spacing: 1px;
    }
  </style>
</head>

<body>

  <canvas id="matrix"></canvas>

  <main class="center">
    <div class="card">
      <h1>SITE EM CONSTRUÇÃO</h1>
      <div class="ghost-line">
        • NOCTE SAPIENTIA •
      </div>
    </div>
  </main>

  <script>
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');

    function fit() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    fit();
    window.addEventListener('resize', fit);

    const letters = "アァカサタナハマヤラワ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ*+<>/?%$#@";
    const fontSize = 18;
    let columns = Math.floor(window.innerWidth / fontSize);
    let drops = new Array(columns).fill(1);

    function draw() {
      ctx.fillStyle = "rgba(0,0,0,0.07)";
      ctx.fillRect(0,0,canvas.width,canvas.height);

      ctx.fillStyle = "#0f0";
      ctx.font = fontSize + "px monospace";

      for (let i=0; i<drops.length; i++) {
        const text = letters.charAt(Math.floor(Math.random() * letters.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }

    let intervalId = setInterval(draw, 45);

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        clearInterval(intervalId);
        intervalId = null;
      } else if (!intervalId) {
        intervalId = setInterval(draw, 45);
      }
    });
  </script>

</body>
</html>
